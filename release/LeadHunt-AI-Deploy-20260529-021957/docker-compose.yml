services:
  postgres:
    image: postgres:16-alpine
    container_name: leadhunt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: leadhunt
      POSTGRES_USER: leadhunt
      POSTGRES_PASSWORD: leadhunt_dev_password
    ports:
      - "5432:5432"
    volumes:
      - leadhunt_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadhunt -d leadhunt"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: leadhunt-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - leadhunt_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  leadhunt_postgres_data:
  leadhunt_redis_data:
